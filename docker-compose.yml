version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: aquaguard_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: aquaguard
      MYSQL_USER: aquaguard_user
      MYSQL_PASSWORD: aquaguard_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
